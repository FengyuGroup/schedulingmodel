function dateISO(s){if(!s)return '';s=String(s).trim();let m=s.match(/^(\d{3,4})\/(\d{1,2})\/(\d{1,2})$/);if(m){let y=Number(m[1]);if(y<1911)y+=1911;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;}return /^\d{4}-\d{2}-\d{2}/.test(s)?s.substring(0,10):s}

function progress(s){const sum=s.approved+s.rejected+s.pending;const base=Math.max(s.applied,sum,.00001);const entries=[['approved','已審定',s.approved,'#218360'],['rejected','審退',s.rejected,'#d39946'],['pending','審核中',s.pending,'#a6b4c2']];let notice=Math.abs(s.applied-sum)>.01?`<div class="notice">提醒：三種狀態日數合計 ${fmt(sum)} 日，與已申請 ${fmt(s.applied)} 日不同；請以正式系統核對未確認或重複提報紀錄，圖表未強制補足差額。</div>`:'';if(s.missing)notice+=`<div class="notice">另有 ${s.missing} 件案件缺少已申請日數，未計入上述日數。</div>`;return `<section class="panel"><div class="header"><div><h2 style="margin-bottom:4px">免計工期審查進度</h2><div class="muted small">累計提報 ${days(s.applied)}</div></div><div style="text-align:right"><strong style="font-size:23px;color:var(--teal)">${s.applied?fmt(s.approved/s.applied*100):0}%</strong><div class="small muted">已審定比例</div></div></div><div class="progress">${entries.map(([k,,v])=>`<div class="${k}" style="width:${Math.max(0,v/base*100)}%" title="${k}: ${v} 日"></div>`).join('')}</div><div class="progressLegend">${entries.map(([k,label,v,color])=>`<div class="legendbox"><span class="small muted"><span class="dot" style="background:${color}"></span>${label}</span><strong>${days(v)}</strong></div>`).join('')}</div>${notice}</section>`}

function dateObj(s){let y=Number(s.substring(0,4)),m=Number(s.substring(5,7)),d=Number(s.substring(8,10));return new Date(y,m-1,d,12)}
function calendarPage(code){const p=projectByCode[code]||db.projects[0];let body=back('返回工地','project')+header(`${p.code}｜專案行事曆`,p.name,`<span class="pill">${esc(db.snapshot)} 資料快照</span>`);body+=`<div class="panel"><div class="calendar-header"><button class="btn" data-month-offset="-1">‹ 上個月</button><h2 style="margin:0" id="cal-label"></h2><button class="btn" data-month-offset="1">下個月 ›</button></div><div class="calendar-legend"><span><i class="swatch" style="background:#e7ebf0"></i>契約週休</span><span><i class="swatch" style="background:#ffecd3"></i>春節</span><span><i class="swatch" style="background:#d8eafc"></i>人工不計日</span><span><i class="swatch" style="background:#e6f0fc"></i>案件申請日期</span></div><div id="calendar-body"></div><p class="smallnote">案件標籤僅表示申請涉及該日期，不表示分署已逐日核定。期間換算案件不會塗滿影響期間。</p></div>`;return body}
function renderCalendar(code){const el=$('#calendar-body'),p=projectByCode[code];if(!el||!p)return;const [y,m]=current.month.split('-').map(Number);$('#cal-label').textContent=`${y} 年 ${m} 月`;const first=new Date(y,m-1,1,12),last=new Date(y,m,0,12),start=first.getDay();let items='<div class="calendar-grid">'+['日','一','二','三','四','五','六'].map(x=>`<div class="weekday">${x}</div>`).join('');const spring=new Set(p.spring_dates);const specials=Object.fromEntries(p.overrides.map(o=>[o.date,o]));const dateMap=new Map();for(const ca of db.cases.filter(x=>x.project===code&&x.application_type!=='period'))for(const raw of ca.request_dates){let d=dateISO(raw);if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;if(!dateMap.has(d))dateMap.set(d,[]);dateMap.get(d).push(ca)}let total=Math.ceil((start+last.getDate())/7)*7;for(let i=0;i<total;i++){const d=new Date(y,m-1,i-start+1,12);let iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let dow=d.getDay(),outside=d.getMonth()!==m-1;let weekend=(dow===0&&p.exclude_sun)||(dow===6&&p.exclude_sat);let override=specials[iso];let klass=outside?'outside':override&&override.is_nonworking?'manual':spring.has(iso)?'spring':weekend?'weekend':'';let ca=dateMap.get(iso)||[];items+=`<div class="day ${klass}"><div class="date">${d.getDate()}</div>${!outside?ca.slice(0,2).map(c=>`<button class="eventchip" data-open-case="${c.case_id}" title="${esc(c.case_name)}">${esc(c.case_no)}</button>`).join('')+(ca.length>2?`<span class="hint">另 ${ca.length-2} 件</span>`:''):' '}${!outside&&spring.has(iso)?'<span class="hint">春節</span>':''}</div>`}items+='</div>';el.innerHTML=items}
function revisionsPage(){let body=header('進度表進版紀錄','已建立的工地進版快照');if(!db.revisions.length)body+='<div class="panel empty">這份資料快照尚無進度表進版紀錄。</div>';else body+=`<div class="table-wrap"><table><thead><tr><th>工地</th><th>版本</th><th>日期</th><th>截止日期</th><th>納入案件</th></tr></thead><tbody>${db.revisions.map(r=>`<tr><td>${esc((db.projects.find(p=>p.project_id===r.project_id)||{}).code||'')}</td><td>${esc(r.version_label)}</td><td>${esc(r.revision_date)}</td><td>${esc(r.cutoff_date)}</td><td>${db.revisionCases.filter(x=>x.revision_id===r.revision_id).length}</td></tr>`).join('')}</tbody></table></div>`;return body}
function setPage(page,opts={}){current.page=page;if(opts.project!==undefined)current.project=opts.project;if(opts.case!==undefined)current.case=opts.case;current.query='';current.state='all';render()}
function render(){let content='';switch(current.page){case 'project':content=projectPage(current.project);break;case 'case':content=casePage(current.case);break;case 'documents':content=documentsPage(current.project&&current.project!=='all'?current.project:null);break;case 'calendar':content=calendarPage(current.project);break;case 'revisions':content=revisionsPage();break;default:content=overview()}$('#content').innerHTML=content+`<div class="footer">主管展示版 · 資料庫快照 ${esc(db.snapshot)} · 單一 HTML，無網路請求／資料庫／Edocs 同步 · 唯讀查看</div>`;$all('#nav button').forEach(b=>b.classList.toggle('active',(current.page==='overview'||current.page==='project'||current.page==='case')?b.dataset.page==='overview':b.dataset.page===current.page));if(current.page==='calendar')renderCalendar(current.project);window.scrollTo(0,0)}
function updateCaseTable(){let q=($('#case-search')?.value||'').trim().toLowerCase(),state=$('#case-status')?.value||'all';let list=db.cases.filter(c=>c.project===current.project&&(state==='all'||c.current_stage===state)&&(!q||`${c.case_no} ${c.case_name} ${c.current_stage}`.toLowerCase().includes(q)));$('#case-table').innerHTML=caseTable(list)}
function updateDocsTable(){let q=($('#doc-search')?.value||'').trim().toLowerCase(),project=$('#doc-project')?.value||'all',dir=$('#doc-direction')?.value||'all';let list=db.documents.filter(d=>(project==='all'||d.project===project)&&(dir==='all'||d.direction===dir)&&(!q||`${d.subject} ${d.document_no} ${d.document_date} ${d.project}`.toLowerCase().includes(q))).sort((a,b)=>dateISO(b.document_date).localeCompare(dateISO(a.document_date)));$('#docs-table').innerHTML=documentsTable(list)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){if(b.dataset.page==='calendar')setPage('calendar',{project:current.project||db.projects[0]?.code});else if(b.dataset.page==='documents')setPage('documents',{project:'all'});else setPage(b.dataset.page,{project:null,case:null})}else if(b.dataset.openProject){setPage('project',{project:b.dataset.openProject})}else if(b.dataset.openCase){const c=caseById[Number(b.dataset.openCase)];if(c)setPage('case',{project:c.project,case:c.case_id})}else if(b.dataset.projectCalendar){setPage('calendar',{project:b.dataset.projectCalendar})}else if(b.dataset.openDocs){setPage('documents',{project:b.dataset.openDocs})}else if(b.dataset.monthOffset){let [y,m]=current.month.split('-').map(Number);let d=new Date(y,m-1+Number(b.dataset.monthOffset),1,12);current.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderCalendar(current.project)}else if(b.dataset.back){if(b.dataset.back==='project'&&current.project)setPage('project',{project:current.project});else setPage('overview',{project:null,case:null})}});document.addEventListener('input',e=>{if(e.target.id==='case-search')updateCaseTable();if(e.target.id==='doc-search')updateDocsTable()});document.addEventListener('change',e=>{if(e.target.id==='case-status')updateCaseTable();if(['doc-project','doc-direction'].includes(e.target.id))updateDocsTable()});render();
})();
</script></body></html>
